<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2457d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121926" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Present a block diagram step by step: animate signals between blocks and export one offline HTML page."
    />
    <title>blockflow Story editor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%232457d6'/%3E%3Cpath d='M10 10v20m0-10h20V10m0 10v10' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('blockflow.studio.prefs') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/story/main.js"></script>
  </body>
</html>
